<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Golden Glow for Box Aura -->
    <radialGradient id="goldAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#d97706" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Wood Gradients -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a3412"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>

    <linearGradient id="woodLid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </linearGradient>

    <!-- Gold Trim Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="45%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Vinyl Disc Gradient -->
    <radialGradient id="vinylGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="25%" stop-color="#ef4444"/>
      <stop offset="30%" stop-color="#0f172a"/>
      <stop offset="75%" stop-color="#1e293b"/>
      <stop offset="90%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="retroShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. App Icon Base Squircle with Bevel Border -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  <!-- Beveled Inner Border (Retro OS 3D Frame) -->
  <rect x="22" y="22" width="468" height="468" rx="102" fill="none" stroke="#60a5fa" stroke-width="6" opacity="0.6"/>
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#1d4ed8" stroke-width="4"/>

  <!-- Pixel Grid Subtle Texture -->
  <pattern id="pixelGrid" width="16" height="16" patternUnits="userSpaceOnUse">
    <rect width="16" height="16" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03"/>
  </pattern>
  <rect x="28" y="28" width="456" height="456" rx="96" fill="url(#pixelGrid)"/>

  <!-- 2. Radiant Golden Aura -->
  <circle cx="256" cy="270" r="190" fill="url(#goldAura)"/>

  <!-- 3. Magical 3D Music Box Showcase -->
  <g filter="url(#retroShadow)">
    
    <!-- Cast Shadow under box -->
    <ellipse cx="256" cy="415" rx="160" ry="24" fill="#020617" opacity="0.75"/>

    <!-- Rising Light Beams from inside the Box -->
    <polygon points="170,260 210,130 302,130 342,260" fill="#fef08a" opacity="0.35"/>
    <polygon points="200,260 235,90 277,90 312,260" fill="#ffffff" opacity="0.45"/>

    <!-- Emerging Glowing Vinyl Disc -->
    <g transform="translate(256, 210)">
      <ellipse cx="0" cy="0" rx="88" ry="46" fill="url(#vinylGrad)" stroke="#facc15" stroke-width="4"/>
      <!-- Grooves -->
      <ellipse cx="0" cy="0" rx="68" ry="34" fill="none" stroke="#475569" stroke-width="2" opacity="0.7"/>
      <ellipse cx="0" cy="0" rx="48" ry="24" fill="none" stroke="#475569" stroke-width="2" opacity="0.7"/>
      <!-- Center Label & Hole -->
      <ellipse cx="0" cy="0" rx="24" ry="12" fill="#ef4444"/>
      <ellipse cx="0" cy="0" rx="8" ry="4" fill="#0f172a"/>
    </g>

    <!-- BOX LID (Open in 3D perspective) -->
    <g transform="translate(256, 175)">
      <!-- Lid Interior (Darker) -->
      <polygon points="-160,50 -130,-45 130,-45 160,50" fill="#431407" stroke="#0f172a" stroke-width="6"/>
      <!-- Lid Top Face (Lighter Wood) -->
      <polygon points="-155,42 -125,-40 125,-40 155,42" fill="url(#woodLid)"/>
      <!-- Gold Rim Trim on Lid -->
      <polygon points="-155,42 -125,-40 -115,-40 -145,42" fill="url(#goldGrad)"/>
      <polygon points="145,42 115,-40 125,-40 155,42" fill="url(#goldGrad)"/>
      <polygon points="-125,-40 125,-40 125,-32 -125,-32" fill="url(#goldGrad)"/>
      <!-- Center Crest/Gem on Lid -->
      <rect x="-14" y="-20" width="28" height="28" rx="6" fill="url(#goldGrad)" stroke="#0f172a" stroke-width="3" transform="rotate(45)"/>
      <circle cx="0" cy="-6" r="6" fill="#38bdf8"/>
    </g>

    <!-- BOX CHEST BODY -->
    <g transform="translate(256, 320)">
      <!-- Main Outer Body -->
      <rect x="-160" y="-70" width="320" height="150" rx="14" fill="#0f172a"/>
      <rect x="-154" y="-64" width="308" height="138" rx="10" fill="url(#woodGrad)"/>

      <!-- Wood Inset Panels (Bevel) -->
      <rect x="-138" y="-48" width="120" height="106" rx="6" fill="#7c2d12" stroke="#431407" stroke-width="4"/>
      <rect x="18" y="-48" width="120" height="106" rx="6" fill="#7c2d12" stroke="#431407" stroke-width="4"/>

      <!-- Golden Corner Brackets with Rivets -->
      <!-- Top-Left -->
      <rect x="-154" y="-64" width="36" height="36" fill="url(#goldGrad)" stroke="#0f172a" stroke-width="4"/>
      <circle cx="-136" cy="-46" r="4" fill="#451a03"/>
      <!-- Top-Right -->
      <rect x="118" y="-64" width="36" height="36" fill="url(#goldGrad)" stroke="#0f172a" stroke-width="4"/>
      <circle cx="136" cy="-46" r="4" fill="#451a03"/>
      <!-- Bottom-Left -->
      <rect x="-154" y="38" width="36" height="36" fill="url(#goldGrad)" stroke="#0f172a" stroke-width="4"/>
      <circle cx="-136" cy="56" r="4" fill="#451a03"/>
      <!-- Bottom-Right -->
      <rect x="118" y="38" width="36" height="36" fill="url(#goldGrad)" stroke="#0f172a" stroke-width="4"/>
      <circle cx="136" cy="56" r="4" fill="#451a03"/>

      <!-- Golden Lock Plate with Keyhole -->
      <rect x="-28" y="-40" width="56" height="66" rx="8" fill="url(#goldGrad)" stroke="#0f172a" stroke-width="5"/>
      <rect x="-20" y="-32" width="40" height="50" rx="4" fill="none" stroke="#fef08a" stroke-width="2"/>
      <!-- Keyhole -->
      <circle cx="0" cy="-14" r="8" fill="#0f172a"/>
      <polygon points="-4,-10 4,-10 6,8 -6,8" fill="#0f172a"/>
      <!-- Gem in lock plate -->
      <circle cx="0" cy="-14" r="3" fill="#38bdf8"/>
    </g>

    <!-- 4. Floating Pixel Musical Notes (Vibrant 8-Bit Emblems) -->
    <!-- Note 1: Double Note (Electric Cyan / Aqua) -->
    <g transform="translate(100, 100)" filter="url(#neonGlow)">
      <!-- Stems & Bar -->
      <rect x="24" y="0" width="12" height="60" fill="#0284c7" stroke="#0f172a" stroke-width="3"/>
      <rect x="62" y="-12" width="12" height="60" fill="#0284c7" stroke="#0f172a" stroke-width="3"/>
      <polygon points="24,0 74,-12 74,4 24,16" fill="#38bdf8" stroke="#0f172a" stroke-width="3"/>
      <!-- Note Heads -->
      <ellipse cx="20" cy="58" rx="20" ry="14" fill="#38bdf8" stroke="#0f172a" stroke-width="4" transform="rotate(-20 20 58)"/>
      <ellipse cx="58" cy="46" rx="20" ry="14" fill="#38bdf8" stroke="#0f172a" stroke-width="4" transform="rotate(-20 58 46)"/>
      <ellipse cx="22" cy="55" rx="8" ry="5" fill="#ffffff" transform="rotate(-20 22 55)"/>
      <ellipse cx="60" cy="43" rx="8" ry="5" fill="#ffffff" transform="rotate(-20 60 43)"/>
    </g>

    <!-- Note 2: Single Note (Vibrant Hot Pink / Magenta) -->
    <g transform="translate(340, 115)" filter="url(#neonGlow)">
      <!-- Stem & Flag -->
      <rect x="36" y="0" width="12" height="58" fill="#be185d" stroke="#0f172a" stroke-width="3"/>
      <path d="M48,0 C64,12 68,26 50,38 L48,26 Z" fill="#ec4899" stroke="#0f172a" stroke-width="2"/>
      <!-- Note Head -->
      <ellipse cx="30" cy="56" rx="20" ry="14" fill="#f43f5e" stroke="#0f172a" stroke-width="4" transform="rotate(-20 30 56)"/>
      <ellipse cx="32" cy="53" rx="8" ry="5" fill="#ffffff" transform="rotate(-20 32 53)"/>
    </g>

    <!-- 5. 8-Bit Pixel Sparkles & Stars -->
    <!-- Gold Pixel Star Left -->
    <g transform="translate(70, 240)">
      <polygon points="16,0 22,10 32,16 22,22 16,32 10,22 0,16 10,10" fill="#facc15" stroke="#78350f" stroke-width="2"/>
      <circle cx="16" cy="16" r="3" fill="#ffffff"/>
    </g>
    <!-- Gold Pixel Star Right -->
    <g transform="translate(400, 260)">
      <polygon points="18,0 24,12 36,18 24,24 18,36 12,24 0,18 12,12" fill="#facc15" stroke="#78350f" stroke-width="2"/>
      <circle cx="18" cy="18" r="4" fill="#ffffff"/>
    </g>
    <!-- Pixel Heart -->
    <g transform="translate(236, 90)" filter="url(#neonGlow)">
      <path d="M20,6 A6,6 0 0,0 10,14 L20,24 L30,14 A6,6 0 0,0 20,6 Z" fill="#ef4444" stroke="#ffffff" stroke-width="2" transform="scale(1.4)"/>
    </g>
  </g>

  <!-- Retro Text Banner at Bottom -->
  <rect x="136" y="440" width="240" height="34" rx="8" fill="#1e3a8a" stroke="#60a5fa" stroke-width="3"/>
  <text x="256" y="463" font-family="'Press Start 2P', monospace, sans-serif" font-size="14" font-weight="900" fill="#fef08a" text-anchor="middle" letter-spacing="3">BOXMUSIC</text>
</svg>
